services:
  - type: web
    name: lyftr-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LITELLM_CACHE_DIR
        value: /data/litellm_cache
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
